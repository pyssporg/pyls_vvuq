[project]
name = "pylsuq"
version = "0.1.0"
authors = [{name = "Axel Matstoms", email = "axel.matstoms@saabgroup.com"}]
dependencies = [
    "lxml"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.package-data]
pylsuq = ["schema/*.xsd", "schema/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
